[project]
name = "ha-eventbrite"
version = "0.1.0"
description = "Home Assistant custom integration for Eventbrite events"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
test = [
  "homeassistant>=2026.5.0",
  "pytest>=8.0",
  "pytest-homeassistant-custom-component>=0.13.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "ANN",
  "A",
  "C4",
  "COM",
  "DTZ",
  "ERA",
  "FA",
  "ISC",
  "LOG",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RUF",
  "S",
  "SIM",
  "TID",
  "YTT",
]
ignore = [
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
"custom_components/eventbrite/const.py" = ["S105"]
"tests/**/*.py" = ["S101"]
